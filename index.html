const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* Bump this (and the matching version.json) on every deploy so open tabs get
   prompted to reload instead of running stale code silently. */
const APP_VERSION = "2026-08-14.19";
function useVersionCheck() {
  const [updateAvailable, setUpdateAvailable] = useState(false);
  useEffect(() => {
    const check = async () => {
      try {
        const res = await fetch("version.json?_=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        if (data.version && data.version !== APP_VERSION) setUpdateAvailable(true);
      } catch (e) {}
    };
    check();
    const onVis = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVis);
    const interval = setInterval(check, 45000);
    return () => { document.removeEventListener("visibilitychange", onVis); clearInterval(interval); };
  }, []);
  return updateAvailable;
}

/* ---------- Auth REST calls ---------- */
async function authSignIn(email, password) {
  const res = await fetch(AUTH_SIGNIN_URL, { method: "POST", body: JSON.stringify({ email, password, returnSecureToken: true }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Log in failed");
  return data;
}
async function authSignUp(email, password) {
  const res = await fetch(AUTH_SIGNUP_URL, { method: "POST", body: JSON.stringify({ email, password, returnSecureToken: true }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Sign up failed");
  return data;
}
async function authRefresh(refreshToken) {
  const res = await fetch(AUTH_REFRESH_URL, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Session refresh failed");
  return { idToken: data.id_token, refreshToken: data.refresh_token, localId: data.user_id };
}
function authErrorMessage(err) {
  const code = err.message || "";
  if (code.includes("EMAIL_EXISTS")) return "An account with that email already exists — try logging in instead.";
  if (code.includes("EMAIL_NOT_FOUND") || code.includes("INVALID_PASSWORD") || code.includes("INVALID_LOGIN_CREDENTIALS")) return "Incorrect email or password.";
  if (code.includes("WEAK_PASSWORD")) return "Password must be at least 6 characters.";
  if (code.includes("INVALID_EMAIL")) return "That doesn't look like a valid email address.";
  if (code.includes("PASTE_YOUR_WEB_API_KEY")) return "Console isn't configured yet — missing Firebase Web API Key.";
  return "Something went wrong. Please try again.";
}

const SESSION_KEY = "suo-console:session";
function saveSession(session, remember) {
  try {
    const store = remember ? localStorage : sessionStorage;
    store.setItem(SESSION_KEY, JSON.stringify(session));
    (remember ? sessionStorage : localStorage).removeItem(SESSION_KEY);
  } catch (e) {}
}
function loadSession() {
  try { const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function getCarOptions(trainType, fleetNo) {
  if (!fleetNo) return [];
  if (trainType === "VLocity BG" || trainType === "VLocity SG") {
    const m = fleetNo.match(/\d+/);
    const num = m ? parseInt(m[0], 10) : null;
    if (num === null) return [];
    if (num >= 100) {
      const suffix = String(num % 100).padStart(2, "0");
      return [`21${suffix}`, `22${suffix}`];
    }
    const suffix = String(num).padStart(2, "0");
    return [`11${suffix}`, `12${suffix}`];
  }
  if (trainType === "Sprinter" || trainType === "Locomotive") return [fleetNo];
  if (trainType === "N-Set") {
    const map = {
      VN10: ["ACN30", "BRN29", "BN28", "BZN274", "BZN276"],

}

function entryMatchesFault(entry, faultValue) {
  if ((entry.faultFlags || []).includes(faultValue)) return true;

function ageDays(entry) {
  const ts = entry.submittedAt || new Date(entry.date + "T00:00:00").getTime();

}

function applyFilters(entries, filters) {
  const now = Date.now();
  return entries.filter((e) => {
    if (filters.openOnly && !e.repairRequired) return false;
    if (filters.truck !== "all" && e.truck !== filters.truck) return false;
    if (filters.range !== "all") {
      const ts = e.submittedAt || new Date(e.date + "T00:00:00").getTime();
      const days = (now - ts) / 86400000;
      if (filters.range === "today" && days > 1) return false;
      if (filters.range === "week" && days > 7) return false;
    }
    if (filters.fault !== "all" && !entryMatchesFault(e, filters.fault)) return false;
    return true;
  });
}

let _audioCtx = null;
function playRepairAlert() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    // Two-tone alert chime, distinct from the visual flash
    [{ freq: 880, start: 0 }, { freq: 660, start: 0.16 }].forEach(({ freq, start }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(0, now + start);
      gain.gain.linearRampToValueAtTime(0.18, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + 0.25);
    });
  } catch (e) {}
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-AU", { day: "2-digit", month: "short", year: "numeric" }); }
function shortDate(iso) { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-AU", { day: "2-digit", month: "short" }); }
function faultCodeLabel(code) { if (!code) return ""; const c = TOILET_FAULT_CODES.find((x) => x.code === code); return c ? `CODE ${c.code} — ${c.name}` : code; }
function faultSummary(entry) {
  if (entry.faultText) return entry.faultText;
  const parts = [];
  if (entry.faultCode) { const c = TOILET_FAULT_CODES.find((x) => x.code === entry.faultCode); parts.push(c ? `CODE ${c.code} — ${c.name}` : entry.faultCode); }
  if (entry.faultFlags?.length) parts.push(entry.faultFlags.join(", "));
  return parts.length ? parts.join(" — ") : "Repair required";
}

/* ---------- Charts ---------- */
function BarChart({ data, color = "var(--amber)", height = 160 }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const max = Math.max(1, ...data.map((d) => d.value));
  const hasData = data.some((d) => d.value > 0);
  if (!hasData) return <div style={styles.emptyState}>No data yet.</div>;
  const bottomPad = 34;
  const topPad = 18;
  const maxBarWidth = 44;
  return (
    <div style={styles.chartWrap}>
      <svg viewBox={`0 0 300 ${height}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet" style={{ overflow: "visible", display: "block" }}>
        {data.map((d, i) => {
          const slot = 300 / data.length;
          const bw = Math.min(maxBarWidth, slot - 14);
          const x = i * slot + (slot - bw) / 2;
          const barH = (d.value / max) * (height - bottomPad - topPad);
          const active = hoverIdx === i;
          const labelX = x + bw / 2;
          const barY = height - bottomPad - barH;
          const words = d.label.split(" ");
          return (
            <g key={d.label} onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)} onClick={() => setHoverIdx(active ? null : i)} style={{ cursor: "pointer" }}>
              <rect x={x} y={barY} width={bw} height={Math.max(barH, 1.5)} rx={4} fill={active ? "var(--amber-light)" : color} opacity={active ? 1 : 0.85} />
              <text x={labelX} y={height - bottomPad + 13} fontSize="8" fill="var(--muted)" textAnchor="middle" fontFamily="'IBM Plex Mono', monospace">
                {words.map((w, wi) => <tspan key={wi} x={labelX} dy={wi === 0 ? 0 : 10}>{w}</tspan>)}
              </text>
              {active && <text x={labelX} y={barY - 6} fontSize="10" fontWeight="700" fill="var(--chalk)" textAnchor="middle" fontFamily="'IBM Plex Mono', monospace">{d.value}</text>}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function LineChart({ series, height = 190 }) {
  const [hover, setHover] = useState(null);
  const allPoints = series.flatMap((s) => s.points);
  if (allPoints.length === 0) return <div style={styles.emptyState}>No data yet.</div>;
  const allVals = allPoints.map((p) => p.y);
  const minV = Math.min(...allVals, 0), maxV = Math.max(...allVals, 1);
  const range = maxV - minV || 1;
  const padX = 10, padY = 12, w = 300;
  const maxLen = Math.max(...series.map((s) => s.points.length), 1);
  const stepX = maxLen > 1 ? (w - padX * 2) / (maxLen - 1) : 0;
  const yFor = (v) => height - padY - ((v - minV) / range) * (height - padY * 2 - 14);
  return (
    <div style={styles.chartWrap}>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ overflow: "visible" }}>
        {series.map((s) => {
          const coords = s.points.map((p, i) => [padX + i * stepX, yFor(p.y)]);
          const path = coords.map((c, i) => `${i === 0 ? "M" : "L"}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
          return (
            <g key={s.label}>
              <path d={path} fill="none" stroke={s.color} strokeWidth="2" />
              {coords.map((c, i) => (
                <circle key={i} cx={c[0]} cy={c[1]} r={hover?.series === s.label && hover?.idx === i ? 4.5 : 2.5} fill={s.color} style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHover({ series: s.label, idx: i, point: s.points[i] })} onMouseLeave={() => setHover(null)}
                  onClick={() => setHover(hover?.series === s.label && hover?.idx === i ? null : { series: s.label, idx: i, point: s.points[i] })} />
              ))}
            </g>
          );
        })}
      </svg>
      <div style={styles.chartLegend}>{series.map((s) => (<span key={s.label} style={styles.legendItem}><span style={{ ...styles.legendDot, background: s.color }} />{s.label}</span>))}</div>
      <div style={styles.chartTooltip}>{hover ? `${hover.series} — ${shortDate(hover.point.label)}: ${hover.point.y.toLocaleString()} km` : ""}</div>
    </div>
  );
}

function DonutStat({ a, b, labelA, labelB, colorA = "var(--amber)", colorB = "var(--panel-3)" }) {
  const total = a + b || 1;
  const pctA = (a / total) * 100;
  const circumference = 2 * Math.PI * 40;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
      <svg width="86" height="86" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke={colorB} strokeWidth="14" />
        <circle cx="50" cy="50" r="40" fill="none" stroke={colorA} strokeWidth="14" strokeDasharray={`${(pctA / 100) * circumference} ${circumference}`} strokeLinecap="round" transform="rotate(-90 50 50)" />
        <text x="50" y="55" textAnchor="middle" fontSize="20" fontWeight="700" fill="var(--chalk)" fontFamily="'IBM Plex Mono', monospace">{a + b}</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5 }}>
        <span><span style={{ ...styles.legendDot, background: colorA }} />{labelA}: <b>{a}</b> <span style={{ color: "var(--muted)" }}>({Math.round(pctA)}%)</span></span>
        <span><span style={{ ...styles.legendDot, background: colorB }} />{labelB}: <b>{b}</b> <span style={{ color: "var(--muted)" }}>({Math.round(100 - pctA)}%)</span></span>
      </div>
    </div>
  );
}

function BugReportModal({ session, profile, onClose, showToast }) {
  const [description, setDescription] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!description.trim() || busy) return;
    setBusy(true);
    try {
      await submitBugReport({
        description: description.trim(), reporterName: profile?.name || session.email, reporterEmail: session.email,
        page: "console", submittedAt: Date.now(), resolved: false,
      });
      showToast("Bug report sent — thanks for flagging it");
      onClose();
    } catch (e) {
      showToast("Couldn't send report — check your connection");
    }
    setBusy(false);
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div className="rise" style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <span style={styles.panelTitleText}>Report a bug</span>
          <button type="button" style={styles.refreshBtn} onClick={onClose}><Icon path={ICONS.x} size={14} color="var(--muted)" /></button>
        </div>
        <form onSubmit={submit}>
          <Field label="What went wrong?">
            <textarea style={{ ...styles.textarea, minHeight: 100 }} placeholder="Describe what happened, what you expected, and what screen you were on" value={description} onChange={(e) => setDescription(e.target.value)} autoFocus />
          </Field>
          <button type="submit" disabled={busy} style={{ ...styles.submitBtn, opacity: busy ? 0.6 : 1 }}>{busy ? "Sending…" : "Send report"}</button>
        </form>
      </div>
    </div>
  );
}

function ConsoleLoginPage({ onAuthed }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [rememberMe, setRememberMe] = useState(true);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email || !password) { setError("Enter your email and password."); return; }
    if (mode === "signup") {
      if (!name.trim()) { setError("Enter your name."); return; }
      if (!email.trim().toLowerCase().endsWith(ALLOWED_DOMAIN)) { setError(`Sign up is restricted to ${ALLOWED_DOMAIN} addresses.`); return; }
    }
    setBusy(true);
    try {
      let auth;
      if (mode === "signup") {
        auth = await authSignUp(email, password);
        setCurrentIdToken(auth.idToken);
        await saveOperatorProfile(auth.localId, { name: name.trim(), email, status: "approved", createdAt: Date.now() });
      } else {
        auth = await authSignIn(email, password);
        setCurrentIdToken(auth.idToken);
      }
      const session = { uid: auth.localId, idToken: auth.idToken, refreshToken: auth.refreshToken, email };
      saveSession(session, rememberMe);
      onAuthed(session);
    } catch (err) { setError(authErrorMessage(err)); }
    setBusy(false);
  };

  return (
    <div style={styles.loginWrap}>
      <div className="rise" style={styles.loginCard}>
        <div style={styles.loginLogoRow}>
          <div style={styles.logoMark}><Icon path={ICONS.gauge} size={24} color="#0E1A16" /></div>
          <div>
            <div style={styles.title}>SOUTHERN CROSS STATION</div>
            <div style={styles.subtitle}>SUO Dashboard</div>
          </div>
        </div>

        <div style={styles.loginTabs}>
          {["login", "signup"].map((m) => (
            <button key={m} type="button" onClick={() => { setMode(m); setError(""); }} style={styles.loginTab}>
              {m === "login" ? "Log In" : "Sign Up"}
              {mode === m && <span style={styles.loginTabUnderline} />}
            </button>
          ))}
        </div>

        <form onSubmit={submit}>
          {mode === "signup" && (
            <Field label="Your name">
              <div style={styles.inputWithIcon}>
                <Icon path={ICONS.user} size={15} color="var(--muted)" style={styles.inputIcon} />
                <input style={styles.inputIndented} placeholder="Full name" value={name} onChange={(e) => setName(e.target.value)} />
              </div>
            </Field>
          )}
          <Field label="Email">
            <div style={styles.inputWithIcon}>
              <Icon path={ICONS.mail} size={15} color="var(--muted)" style={styles.inputIcon} />
              <input style={styles.inputIndented} type="email" autoCapitalize="none" placeholder="you@example.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            </div>
            {mode === "signup" && <span style={styles.fieldHint}>{ALLOWED_DOMAIN} addresses are approved automatically</span>}
          </Field>
          <Field label="Password">
            <div style={styles.inputWithIcon}>
              <Icon path={ICONS.lock} size={15} color="var(--muted)" style={styles.inputIcon} />
              <input style={{ ...styles.inputIndented, paddingRight: 40 }} type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} />
              <button type="button" style={styles.eyeToggle} onClick={() => setShowPassword((s) => !s)} aria-label="Show password">
                <Icon path={showPassword ? ICONS.eyeOff : ICONS.eye} size={16} color="var(--muted)" />
              </button>
            </div>
          </Field>
          <div style={styles.rememberRow} onClick={() => setRememberMe((r) => !r)}>
            <div style={{ ...styles.checkbox, ...(rememberMe ? styles.checkboxOn : {}) }}>{rememberMe && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
            <span style={styles.toggleLabel}>Remember me</span>
          </div>
          {error && <div style={styles.loginError}><Icon path={ICONS.alert} size={13} style={{ marginRight: 6, flexShrink: 0 }} />{error}</div>}
          <button type="submit" disabled={busy} style={{ ...styles.submitBtn, opacity: busy ? 0.6 : 1 }}>{busy ? "Please wait…" : mode === "login" ? "Log In" : "Sign Up"}</button>
        </form>
      </div>
    </div>
  );
}

function AdminPanel({ showToast, currentUid }) {
  const [operators, setOperators] = useState(null);
  const [bugReports, setBugReports] = useState(null);
  const [health, setHealth] = useState(null);
  const [healthRunning, setHealthRunning] = useState(false);
  const [onlineUids, setOnlineUids] = useState(null);
  const [checkingOnline, setCheckingOnline] = useState(false);
  const ONLINE_WINDOW_MS = 90000; // presence heartbeat is every 60s, so 90s = "active right now"

  const checkOnline = async () => {
    setCheckingOnline(true);
    try {
      const raw = await fbGetRaw("presence");
      const now = Date.now();
      const online = new Set(Object.entries(raw || {}).filter(([, v]) => now - (v.lastSeen || 0) < ONLINE_WINDOW_MS).map(([uid]) => uid));
      setOnlineUids(online);
    } catch (e) { showToast("Couldn't check who's online"); }
    setCheckingOnline(false);
  };

  const loadOperators = async () => {
    try {
      const raw = await fbGetRaw("operators");
      setOperators(raw ? Object.entries(raw).map(([uid, v]) => ({ uid, ...v })) : []);
    } catch (e) { showToast("Couldn't load operators"); }
  };
  const loadBugs = async () => {
    try {
      const raw = await fbGetRaw("bugReports");
      setBugReports(raw ? Object.entries(raw).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0)) : []);
    } catch (e) { showToast("Couldn't load bug reports"); }
  };
  useEffect(() => {
    loadOperators();
    loadBugs();
    const poll = setInterval(() => { loadOperators(); loadBugs(); }, 15000);
    return () => clearInterval(poll);
  }, []);

  const setOperatorStatus = async (op, status) => {
    if (op.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase()) { showToast("The primary admin account can't be revoked"); return; }
    try { await fbSet("operators", op.uid, { ...op, status }); showToast(status === "approved" ? `${op.name} approved` : `${op.name} rejected`); loadOperators(); }
    catch (e) { showToast("Update failed — check connection"); }
  };
  const setOperatorAdmin = async (op, isAdmin) => {
    if (!isAdmin && op.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase()) { showToast("The primary admin account can't have its admin rights removed"); return; }
    try { await fbSet("operators", op.uid, { ...op, isAdmin }); showToast(isAdmin ? `${op.name} is now an admin` : `${op.name}'s admin rights removed`); loadOperators(); }
    catch (e) { showToast("Update failed — check connection"); }
  };
  const resolveBug = async (bug) => {
    try { await fbSet("bugReports", bug.id, { ...bug, resolved: true }); loadBugs(); }
    catch (e) { showToast("Update failed — check connection"); }
  };

  const runHealthCheck = async () => {
    setHealthRunning(true);
    const checks = [];
    const t0 = performance.now();
    try { await fbGetRaw("services"); checks.push({ name: "Database read", ok: true, detail: `${Math.round(performance.now() - t0)}ms` }); }
    catch (e) { checks.push({ name: "Database read", ok: false, detail: "Failed" }); }
    const t1 = performance.now();
    try { await fbSet("healthcheck", "ping", { at: Date.now() }); checks.push({ name: "Database write", ok: true, detail: `${Math.round(performance.now() - t1)}ms` }); }
    catch (e) { checks.push({ name: "Database write", ok: false, detail: "Failed" }); }
    checks.push({ name: "Auth session", ok: !!CURRENT_ID_TOKEN, detail: CURRENT_ID_TOKEN ? "Token present" : "Missing" });
    checks.push({ name: "Browser online", ok: navigator.onLine, detail: navigator.onLine ? "Connected" : "Offline" });
    checks.push({ name: "API key configured", ok: FIREBASE_API_KEY !== "PASTE_YOUR_WEB_API_KEY_HERE", detail: FIREBASE_API_KEY !== "PASTE_YOUR_WEB_API_KEY_HERE" ? "Set" : "Missing" });
    setHealth(checks);
    setHealthRunning(false);
  };

  const pending = (operators || []).filter((o) => o.status === "pending");
  const approved = (operators || []).filter((o) => o.status === "approved");
  const openBugs = (bugReports || []).filter((b) => !b.resolved);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
        <button style={styles.reportFaultBtn} onClick={() => { loadOperators(); loadBugs(); showToast("Refreshed"); }}>
          <Icon path={ICONS.refresh} size={13} style={{ marginRight: 6 }} />Refresh
        </button>
      </div>
      <div className="rise dash-panel" style={styles.panel}>
        <div className="panel-title" style={styles.panelTitle}>Pending Approvals{pending.length > 0 ? ` (${pending.length})` : ""}</div>
        {operators === null ? <div style={styles.emptyState}>Loading…</div> : pending.length === 0 ? (
          <div style={styles.allClear}><Icon path={ICONS.check} size={16} color="var(--ok)" style={{ marginRight: 8 }} />No pending requests</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {pending.map((op) => (
              <div key={op.uid} style={styles.snapshotCard}>
                <div style={styles.snapshotTop}><span style={styles.snapshotTruck}><Icon path={ICONS.user} size={14} style={{ marginRight: 6 }} />{op.name}</span></div>
                <div style={styles.snapshotMeta}>{op.email}</div>
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button style={styles.approveBtn} onClick={() => setOperatorStatus(op, "approved")}>Approve</button>
                  <button style={styles.rejectBtn} onClick={() => setOperatorStatus(op, "rejected")}>Reject</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rise dash-panel" style={styles.panel}>
        <div className="panel-title" style={styles.panelTitle}>Approved Operators{approved.length > 0 ? ` (${approved.length})` : ""}</div>
        {operators === null ? <div style={styles.emptyState}>Loading…</div> : approved.length === 0 ? (
          <div style={styles.emptyState}>No approved operators yet.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {approved.map((op) => {
              const isProtected = op.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
              return (
              <div key={op.uid} style={{ ...styles.snapshotCard, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                <span>
                  <Icon path={ICONS.user} size={13} style={{ marginRight: 8 }} />{op.name} <span style={{ color: "var(--muted)", fontSize: 11.5 }}>({op.email})</span>
                  {op.isAdmin && <span style={{ ...styles.chip, marginLeft: 8 }}>Admin</span>}
                  {isProtected && <span style={{ ...styles.chip, marginLeft: 6, color: "var(--amber-light)", background: "rgba(245,166,35,0.14)" }}>Protected</span>}
                </span>
                <div style={{ display: "flex", gap: 8 }}>
                  {!isProtected && op.uid !== currentUid && (
                    op.isAdmin
                      ? <button style={styles.rejectBtn} onClick={() => setOperatorAdmin(op, false)}>Remove admin</button>
                      : <button style={styles.approveBtn} onClick={() => setOperatorAdmin(op, true)}>Make admin</button>
                  )}
                  {!isProtected && <button style={styles.rejectBtn} onClick={() => setOperatorStatus(op, "rejected")}>Revoke</button>}
                </div>
              </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="rise dash-panel" style={styles.panel}>
        <div style={styles.panelTitleRow}>
          <div className="panel-title" style={{ ...styles.panelTitle, marginBottom: 0 }}>All Sign-ups{operators ? ` (${operators.length})` : ""}</div>
          <button style={styles.reportFaultBtn} onClick={checkOnline} disabled={checkingOnline}>
            <Icon path={ICONS.circle} size={9} color="var(--ok)" style={{ marginRight: 6 }} />{checkingOnline ? "Checking…" : "Who's online?"}
          </button>
        </div>
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 14 }}>
          Every account that has ever signed up, regardless of email domain or approval status.
          {onlineUids !== null && <React.Fragment> · <span style={{ color: "var(--ok)", fontWeight: 700 }}>{onlineUids.size} online now</span> (active in the last 90 seconds)</React.Fragment>}
        </div>
        {operators === null ? <div style={styles.emptyState}>Loading…</div> : operators.length === 0 ? (
          <div style={styles.emptyState}>No sign-ups yet.</div>
        ) : (
          <div style={styles.signupTableWrap}>
            <table style={styles.signupTable}>
              <thead>
                <tr>
                  <th style={styles.signupTh}>Name</th>
                  <th style={styles.signupTh}>Email</th>
                  <th style={styles.signupTh}>Status</th>
                  <th style={styles.signupTh}>Admin</th>
                  <th style={styles.signupTh}>Signed up</th>
                  <th style={styles.signupTh}></th>
                </tr>
              </thead>
              <tbody>
                {[...operators].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map((op) => {
                  const isProtected = op.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                  return (
                  <tr key={op.uid}>
                    <td style={styles.signupTd}>
                      {onlineUids !== null && onlineUids.has(op.uid) && <Icon path={ICONS.circle} size={8} color="var(--ok)" style={{ marginRight: 6 }} className="live-dot" />}
                      {op.name || "—"}
                    </td>
                    <td style={styles.signupTd}>{op.email}</td>
                    <td style={styles.signupTd}>
                      <span style={{
                        ...styles.chip,
                        color: op.status === "approved" ? "var(--ok)" : op.status === "rejected" ? "var(--danger)" : "var(--amber-light)",
                        background: op.status === "approved" ? "rgba(63,185,138,0.14)" : op.status === "rejected" ? "rgba(229,72,77,0.14)" : "rgba(245,166,35,0.14)",
                      }}>{op.status || "pending"}</span>
                    </td>
                    <td style={styles.signupTd}>{op.isAdmin ? "Yes" : "—"}{isProtected ? " 🔒" : ""}</td>
                    <td style={styles.signupTd}>{op.createdAt ? new Date(op.createdAt).toLocaleDateString("en-AU") : "—"}</td>
                    <td style={styles.signupTd}>
                      {!isProtected && op.status === "approved" && op.uid !== currentUid && (
                        op.isAdmin
                          ? <button style={styles.signupAdminBtnOff} onClick={() => setOperatorAdmin(op, false)}>Remove admin</button>
                          : <button style={styles.signupAdminBtnOn} onClick={() => setOperatorAdmin(op, true)}>Make admin</button>
                      )}
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="rise dash-panel" style={styles.panel}>
        <div style={styles.panelTitleRow}>
          <div className="panel-title" style={{ ...styles.panelTitle, marginBottom: 0 }}>System Health Check</div>
          <button style={styles.exportBtn} onClick={runHealthCheck} disabled={healthRunning}><Icon path={ICONS.pulse} size={13} style={{ marginRight: 6 }} />{healthRunning ? "Running…" : "Run check"}</button>
        </div>
        {health && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 16 }}>
            {health.map((c) => (
              <div key={c.name} style={styles.healthRow}>
                <Icon path={c.ok ? ICONS.check : ICONS.alert} size={14} color={c.ok ? "var(--ok)" : "var(--danger)"} style={{ marginRight: 8, flexShrink: 0 }} />
                <span style={{ flex: 1 }}>{c.name}</span>
                <span style={{ color: "var(--muted)", fontSize: 11.5 }}>{c.detail}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="rise dash-panel" style={styles.panel}>
        <div className="panel-title" style={styles.panelTitle}>Bug Reports{openBugs.length > 0 ? ` (${openBugs.length} open)` : ""}</div>
        {bugReports === null ? <div style={styles.emptyState}>Loading…</div> : openBugs.length === 0 ? (
          <div style={styles.emptyState}>No open bug reports.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {openBugs.map((b) => (
              <div key={b.id} style={styles.snapshotCard}>
                <div style={{ fontSize: 13, color: "var(--chalk)", fontWeight: 600 }}>{b.description}</div>
                <div style={styles.snapshotMeta}>{b.reporterName} · {b.page} · {new Date(b.submittedAt).toLocaleDateString("en-AU")}</div>
                <button style={{ ...styles.rejectBtn, marginTop: 8 }} onClick={() => resolveBug(b)}>Mark resolved</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const updateAvailable = useVersionCheck();
  const [session, setSession] = useState(null);
  const [forceMobile, setForceMobile] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(() => { try { return localStorage.getItem("suo-console:sound") !== "off"; } catch (e) { return true; } });
  const soundEnabledRef = useRef(soundEnabled);
  useEffect(() => { soundEnabledRef.current = soundEnabled; }, [soundEnabled]);
  const toggleSound = () => {
    setSoundEnabled((s) => {
      const next = !s;
      try { localStorage.setItem("suo-console:sound", next ? "on" : "off"); } catch (e) {}
      if (next) playRepairAlert(); // quick confirmation chirp so you know it's on
      return next;
    });
  };
  const [bugModalOpen, setBugModalOpen] = useState(false);
  const [authChecked, setAuthChecked] = useState(false);
  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [trucks] = useState(DEFAULT_TRUCKS);
  const [fleet] = useState(DEFAULT_FLEET);
  const [logs, setLogs] = useState([]);
  const [inspections, setInspections] = useState([]);
  const [loading, setLoading] = useState(true);
  const [syncState, setSyncState] = useState("connecting"); // connecting | ok | error
  const [toast, setToast] = useState(null);
  const [editingLog, setEditingLog] = useState(null);
  const [flashEntry, setFlashEntry] = useState(null);
  const [secondsAgo, setSecondsAgo] = useState(0);
  const knownLogIds = useRef(null);
  const flashTimer = useRef(null);
  const lastSyncedAt = useRef(null);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); }, []);

  // Restore session on load, refresh the ID token (it's only valid ~1hr)
  useEffect(() => {
    (async () => {
      const saved = loadSession();
      if (!saved) { setAuthChecked(true); return; }
      try {
        const refreshed = await authRefresh(saved.refreshToken);
        setCurrentIdToken(refreshed.idToken);
        const next = { ...saved, idToken: refreshed.idToken, refreshToken: refreshed.refreshToken };
        saveSession(next, !!localStorage.getItem(SESSION_KEY));
        setSession(next);
      } catch (e) { clearSession(); }
      setAuthChecked(true);
    })();
  }, []);

  useEffect(() => {
    if (!session) return;
    const interval = setInterval(async () => {
      try {
        const refreshed = await authRefresh(session.refreshToken);
        setCurrentIdToken(refreshed.idToken);
        const next = { ...session, idToken: refreshed.idToken, refreshToken: refreshed.refreshToken };
        saveSession(next, !!localStorage.getItem(SESSION_KEY));
        setSession(next);
      } catch (e) {}
    }, 45 * 60 * 1000);
    return () => clearInterval(interval);
  }, [session]);

  // Load (and, while pending, poll for) this account's operator profile —
  // determines approval status and whether the Admin tab is visible.
  useEffect(() => {
    if (!session || !session.email.toLowerCase().endsWith(ALLOWED_DOMAIN)) return;
    let cancelled = false;
    const load = async () => {
      try {
        const p = await fetchOperatorProfile(session.uid);
        if (!cancelled) setProfile(p || { status: "pending" });
      } catch (e) {}
    };
    load();
    const poll = setInterval(() => { if (!profile || profile.status !== "approved") load(); }, 15000);
    return () => { cancelled = true; clearInterval(poll); };
  }, [session]);

  const handleSignOut = () => { clearSession(); setCurrentIdToken(null); setSession(null); setProfile(null); };

  const refresh = useCallback(async (silent) => {
    if (!silent) setLoading(true);
    try {
      const [l, i] = await Promise.all([fbGetAll("services"), fbGetAll("inspections")]);
      const sortedLogs = l.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
      if (knownLogIds.current !== null) {
        const newOnes = sortedLogs.filter((x) => !knownLogIds.current.has(x.id));
        if (newOnes.length > 0) {
          setFlashEntry(newOnes[0]);
          clearTimeout(flashTimer.current);
          flashTimer.current = setTimeout(() => setFlashEntry(null), 7000);
          if (newOnes.some((x) => x.repairRequired) && soundEnabledRef.current) playRepairAlert();
        }
      }
      knownLogIds.current = new Set(sortedLogs.map((x) => x.id));
      setLogs(sortedLogs);
      setInspections(i.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0)));
      setSyncState("ok");
      lastSyncedAt.current = Date.now();
      setSecondsAgo(0);
    } catch (e) { setSyncState("error"); }
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!session) return;
    refresh(false);
    const interval = setInterval(() => refresh(true), POLL_MS);
    return () => clearInterval(interval);
  }, [refresh, session]);

  useEffect(() => {
    const tick = setInterval(() => {
      if (lastSyncedAt.current) setSecondsAgo(Math.floor((Date.now() - lastSyncedAt.current) / 1000));
    }, 1000);
    return () => clearInterval(tick);
  }, []);

  // Presence heartbeat — lets the Admin tab show who's active right now
  useEffect(() => {
    if (!session || !profile || profile.status !== "approved") return;
    const beat = () => fbSet("presence", session.uid, { name: profile.name || session.email, email: session.email, lastSeen: Date.now() }).catch(() => {});
    beat();
    const interval = setInterval(beat, 60000);
    return () => clearInterval(interval);
  }, [session, profile]);

  const addLog = async (entry) => {
    const withId = { id: uid(), ...entry, submittedAt: Date.now() };
    try { await fbSet("services", withId.id, withId); setLogs((p) => [withId, ...p]); knownLogIds.current?.add(withId.id); showToast("Service logged"); }
    catch (e) { showToast("Save failed — check connection"); }
  };
  const resolveFault = async (entry, notes) => {
    const updated = { ...entry, resolved: true, resolvedAt: Date.now(), resolvedBy: profile?.name || session.email, resolutionNotes: notes || "" };
    try { await fbSet("services", entry.id, updated); setLogs((p) => p.map((l) => (l.id === entry.id ? updated : l))); showToast("Fault marked resolved"); }
    catch (e) { showToast("Update failed — check connection"); }
  };
  const updateLog = async (entry) => {
    if (!profile?.isAdmin) { showToast("Only admins can edit entries"); return; }
    try { await fbSet("services", entry.id, entry); setLogs((p) => p.map((l) => (l.id === entry.id ? entry : l))); setEditingLog(null); showToast("Service entry updated"); }
    catch (e) { showToast("Update failed — check connection"); }
  };
  const deleteLog = async (id) => {
    if (!profile?.isAdmin) { showToast("Only admins can delete entries"); return; }
    if (!window.confirm("Delete this service entry?")) return;
    try { await fbDelete("services", id); setLogs((p) => p.filter((l) => l.id !== id)); }
    catch (e) { showToast("Delete failed — check connection"); }
  };
  const deleteInspection = async (id) => {
    if (!profile?.isAdmin) { showToast("Only admins can delete entries"); return; }
    if (!window.confirm("Delete this inspection?")) return;
    try { await fbDelete("inspections", id); setInspections((p) => p.filter((i) => i.id !== id)); }
    catch (e) { showToast("Delete failed — check connection"); }
  };
  const clearAllData = async () => {
    if (!profile?.isAdmin) { showToast("Only admins can clear data"); return; }
    if (!window.confirm("This deletes every service entry and inspection for everyone. Continue?")) return;
    if (!window.confirm("Are you sure? This cannot be undone.")) return;
    try {
      await Promise.all([...logs.map((l) => fbDelete("services", l.id)), ...inspections.map((i) => fbDelete("inspections", i.id))]);
      setLogs([]); setInspections([]); showToast("All data cleared");
    } catch (e) { showToast("Clear failed — check connection"); }
  };

  const startEditLog = (entry) => { setEditingLog(entry); setTab("log"); };

  const exportExcel = async () => {
    try {
      const wb = new ExcelJS.Workbook();
      wb.creator = "Southern Cross Station";
      wb.created = new Date();

      const HEADER_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF5A623" } };
      const HEADER_FONT = { bold: true, color: { argb: "FF0E1A16" }, size: 11 };
      const THIN_BORDER = { style: "thin", color: { argb: "FF2A3330" } };
      const styleSheet = (ws, colCount) => {
        ws.getRow(1).eachCell((cell) => {
          cell.fill = HEADER_FILL; cell.font = HEADER_FONT;
          cell.alignment = { vertical: "middle", horizontal: "left", wrapText: true };
          cell.border = { top: THIN_BORDER, left: THIN_BORDER, bottom: THIN_BORDER, right: THIN_BORDER };
        });
        ws.getRow(1).height = 26;
        ws.views = [{ state: "frozen", ySplit: 1 }];
        ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: colCount } };
        ws.eachRow((row, rowNum) => {
          if (rowNum === 1) return;
          row.eachCell((cell) => { cell.border = { bottom: { style: "hair", color: { argb: "FFDADADA" } } }; cell.alignment = { vertical: "middle", wrapText: true }; });

      };

      const wsLog = wb.addWorksheet("Service Log");
      wsLog.columns = [
        { header: "Date", key: "date", width: 12 },
        { header: "Time", key: "time", width: 8 },
        { header: "Truck", key: "truck", width: 10 },
        { header: "Operator", key: "operator", width: 16 },
        { header: "Train Type", key: "trainType", width: 14 },
        { header: "Fleet No.", key: "fleetNo", width: 11 },
        { header: "Car", key: "car", width: 9 },
        { header: "Service Type", key: "serviceType", width: 13 },
        { header: "Repair Required", key: "repairRequired", width: 15 },
        { header: "Fault Code", key: "faultCode", width: 32 },
        { header: "Fault Flags", key: "faultFlags", width: 34 },
        { header: "Pumped & Locked", key: "pumpedLocked", width: 15 },

      styleSheet(wsLog, wsLog.columns.length);

      const wsInsp = wb.addWorksheet("Daily Inspections");

        { header: "Truck", key: "truck", width: 10 },
        { header: "Operator", key: "operator", width: 16 },

        { header: "Fault Notes", key: "faultText", width: 34 },
        { header: "Has Photo", key: "hasPhoto", width: 11 },
        { header: "Notes", key: "notes", width: 30 },

      inspections.forEach((i) => {

      styleSheet(wsInsp, wsInsp.columns.length);

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      URL.revokeObjectURL(url);

  const latestKm = (truck) => {
    const rel = [...logs.filter((l) => l.truck === truck), ...inspections.filter((i) => i.truck === truck)].filter((r) => r.km).sort((a, b) => (a.date < b.date ? 1 : -1));

  const latestInspection = (truck) => {
    const rel = inspections.filter((i) => i.truck === truck).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));

  const isAdmin = profile.isAdmin === true;

  return (
    <div className={forceMobile ? "force-mobile" : ""} style={styles.app}>

          </div>

      <header className="app-wrap" style={styles.header}>

          <div style={styles.logoMark}><Icon path={ICONS.gauge} size={22} color="#0E1A16" /></div>
          <div>
            <div style={styles.title}>SOUTHERN CROSS STATION</div>
            <div style={styles.subtitle}>SUO Dashboard</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ ...styles.syncBadge, ...(syncState === "error" ? styles.syncBadgeError : {}) }}>
            <Icon path={ICONS.circle} size={8} className={syncState === "ok" ? "live-dot" : ""} style={{ marginRight: 5 }} />
            {syncState === "ok" ? `Live · synced ${secondsAgo}s ago` : syncState === "error" ? "Offline" : "Connecting…"}
          </span>
          <button style={styles.refreshBtn} onClick={() => refresh(true)} title="Refresh now"><Icon path={ICONS.refresh} size={15} color="var(--muted)" /></button>
          <button style={styles.viewToggleBtn} onClick={() => setForceMobile((f) => !f)} title="Toggle desktop/mobile view">{forceMobile ? "Mobile view" : "Desktop view"}</button>
          <button style={styles.viewToggleBtn} onClick={toggleSound} title={soundEnabled ? "Mute repair alert sound" : "Unmute repair alert sound"}>
            <Icon path={soundEnabled ? ICONS.speaker : ICONS.speakerOff} size={14} />
          </button>
          <button style={styles.bugPillBtn} onClick={() => setBugModalOpen(true)} title="Report a bug"><Icon path={ICONS.bug} size={13} style={{ marginRight: 6 }} />Report bug</button>
          <button style={styles.refreshBtn} onClick={handleSignOut} title="Sign out"><Icon path={ICONS.logout} size={15} color="var(--muted)" /></button>
        </div>
      </header>

      <nav className="app-wrap" style={styles.tabBar}>
        {[
          { id: "dashboard", label: "Dashboard", icon: ICONS.chart },
          { id: "status", label: "Truck Status", icon: ICONS.gauge },
          { id: "log", label: "Log service", icon: ICONS.gauge },
          ...(isAdmin ? [{ id: "admin", label: "Admin", icon: ICONS.shield }] : []),
          { id: "history", label: "History", icon: ICONS.list },
        ].map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...styles.tabBtn, ...(tab === t.id ? styles.tabBtnActive : {}) }}>{t.label}</button>

      <main className="app-wrap" style={styles.main}>
        {tab === "dashboard" && <Dashboard trucks={trucks} fleet={fleet} logs={logs} inspections={inspections} onAddFault={addLog} onResolveFault={resolveFault} showToast={showToast} />}
        {tab === "status" && <FleetStatus trucks={trucks} latestKm={latestKm} latestStatus={latestStatus} latestInspection={latestInspection} logs={logs} inspections={inspections} />}
        {tab === "log" && <ServiceForm trucks={trucks} fleet={fleet} editingEntry={editingLog} onSubmit={editingLog ? updateLog : addLog} onCancelEdit={() => setEditingLog(null)} />}
        {tab === "admin" && isAdmin && <AdminPanel showToast={showToast} currentUid={session.uid} />}
        {tab === "history" && <History logs={logs} inspections={inspections} onDeleteLog={deleteLog} onDeleteInspection={deleteInspection} onEditLog={startEditLog} onExport={exportExcel} onClearAll={clearAllData} trucks={trucks} isAdmin={isAdmin} />}
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}
      {bugModalOpen && <BugReportModal session={session} profile={profile} onClose={() => setBugModalOpen(false)} showToast={showToast} />}
      {updateAvailable && (
        <div style={styles.updateBanner}>
          <span><Icon path={ICONS.refresh} size={14} style={{ marginRight: 8 }} />A new version is available</span>
          <button style={styles.updateReloadBtn} onClick={() => window.location.reload()}>Reload</button>
        </div>
      )}
    </div>
  );
}

function useCountUp(value, duration = 600) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    const start = prevRef.current;
    const end = value;
    if (start === end) { setDisplay(end); return; }
    const startTime = performance.now();
    let raf;
    const step = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      setDisplay(Math.round(start + (end - start) * t));
      if (t < 1) raf = requestAnimationFrame(step);
      else prevRef.current = end;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return display;
}

  return (
