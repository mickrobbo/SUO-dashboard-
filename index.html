function Dashboard({ trucks, fleet, logs, inspections, onAddFault, onResolveFault, showToast }) {
  const [period, setPeriod] = useState("all"); // "7d" | "30d" | "all"
  const periodLogs = useMemo(() => {
    if (period === "all") return logs;
    const days = period === "7d" ? 7 : 30;
    const cutoff = Date.now() - days * 86400000;
    return logs.filter((l) => (l.submittedAt || 0) >= cutoff);
  }, [logs, period]);
  const periodInspections = useMemo(() => {
    if (period === "all") return inspections;
    const days = period === "7d" ? 7 : 30;
    const cutoff = Date.now() - days * 86400000;
    return inspections.filter((i) => (i.submittedAt || 0) >= cutoff);
  }, [inspections, period]);

  const totalServices = periodLogs.length;
  const totalInspections = periodInspections.length;
  const totalServicesDisplay = useCountUp(totalServices);
  const totalInspectionsDisplay = useCountUp(totalInspections);
  const planned = periodLogs.filter((l) => l.serviceType === "Planned").length;
  const adhoc = periodLogs.filter((l) => l.serviceType === "Ad-hoc").length;

  const [snapshotFilters, setSnapshotFilters] = useState({ openOnly: false, range: "all", truck: "all", fault: "all" });
  const [expandedFault, setExpandedFault] = useState(null);
  const [reportFaultOpen, setReportFaultOpen] = useState(false);
  const [faultView, setFaultView] = useState("code");

  const todayStr = todayISO();
  const workload = trucks.map((truck) => ({ truck, count: logs.filter((l) => l.truck === truck && l.date === todayStr).length }));

  const amPm = useMemo(() => {
    let am = 0, pm = 0;
    periodLogs.forEach((l) => {
      if (!l.time) return;
      const hour = parseInt(l.time.split(":")[0], 10);
      if (Number.isNaN(hour)) return;
      if (hour < 12) am++; else pm++;
    });
    return { am, pm };
  }, [periodLogs]);

  const operatorTally = useMemo(() => {
    const counts = {};
    periodLogs.forEach((l) => { const name = l.operator || "Unassigned"; counts[name] = (counts[name] || 0) + 1; });
    return Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([name, value]) => ({ label: name.split(" ")[0].slice(0, 10), value }));
  }, [periodLogs]);

  const allOpenFaults = useMemo(() => {
    const byFleet = {};
    logs.forEach((l) => {
      if (!l.fleetNo) return;
      const key = `${l.trainType}|${l.fleetNo}`;
      const existing = byFleet[key];
      if (!existing || (l.submittedAt || 0) > (existing.submittedAt || 0)) byFleet[key] = l;
    });
    return Object.values(byFleet).filter((l) => l.repairRequired && !l.resolved);
  }, [logs]);

  const daysSinceLastFault = useMemo(() => {
    const all = [...logs.filter((l) => l.repairRequired), ...inspections.filter((i) => i.repairRequired)];
    if (!all.length) return null;
    const last = all.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0))[0];
    return Math.floor(ageDays(last));
  }, [logs, inspections]);

  const fleetHealthy = allOpenFaults.length === 0;

  const trainRepairSnapshot = useMemo(() => {
    const byFleet = {};
    logs.forEach((l) => {
      if (!l.fleetNo) return;
      const key = `${l.trainType}|${l.fleetNo}`;
      const existing = byFleet[key];
      if (!existing || (l.submittedAt || 0) > (existing.submittedAt || 0)) byFleet[key] = l;
    });
    const openEntries = Object.values(byFleet).filter((l) => l.repairRequired && !l.resolved);
    return applyFilters(openEntries, snapshotFilters).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
  }, [logs, snapshotFilters]);

  const repeatOffenders = useMemo(() => {
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    const byCar = {};
    logs.forEach((l) => {
      if (!l.repairRequired || !l.car) return;
      const ts = l.submittedAt || new Date(l.date + "T00:00:00").getTime();
      if (now - ts > weekMs) return;
      const key = l.car;
      if (!byCar[key]) byCar[key] = [];
      byCar[key].push(l);
    });
    return Object.entries(byCar)
      .filter(([, entries]) => entries.length >= 2)
      .map(([car, entries]) => ({ car, entries: entries.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0)) }))
      .sort((a, b) => b.entries.length - a.entries.length);
  }, [logs]);

  const resolvedFaults = useMemo(() => {
    return logs
      .filter((l) => l.resolved)
      .map((l) => {
        const reportedAt = l.submittedAt || new Date(l.date + "T00:00:00").getTime();
        const resolvedAt = l.resolvedAt || reportedAt;
        const hoursOpen = Math.max(0, Math.round((resolvedAt - reportedAt) / 3600000));
        return { ...l, hoursOpen };
      })
      .sort((a, b) => (b.resolvedAt || 0) - (a.resolvedAt || 0));
  }, [logs]);

  const flagCounts = useMemo(() => {
    const counts = Object.fromEntries(FAULT_FLAGS.map((f) => [f, 0]));
    periodLogs.forEach((l) => (l.faultFlags || []).forEach((f) => { if (counts[f] !== undefined) counts[f]++; }));
    return FAULT_FLAGS.map((f) => ({ label: f.split(" ").slice(0, 2).join(" "), value: counts[f] }));
  }, [periodLogs]);

  const topFaultCodes = useMemo(() => {
    const counts = Object.fromEntries(TOILET_FAULT_CODES.map((c) => [c.code, 0]));
    periodLogs.forEach((l) => { if (l.faultCode && counts[l.faultCode] !== undefined) counts[l.faultCode]++; });
    return TOILET_FAULT_CODES.map((c) => ({ label: `CODE ${c.code}`, value: counts[c.code] }));
  }, [periodLogs]);

  return (
    <div>
      <div
        className="rise dash-panel"
        style={{ ...styles.heroPanel, ...(fleetHealthy ? styles.heroPanelOk : styles.heroPanelAlert), cursor: "pointer" }}
        onClick={() => {
          const el = document.getElementById("fleet-repair-snapshot");
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        }}
      >
        <div style={{ ...styles.heroIconWrap, background: fleetHealthy ? "rgba(63,185,138,0.14)" : "rgba(229,72,77,0.14)" }}>
          <Icon path={fleetHealthy ? ICONS.check : ICONS.alert} size={24} color={fleetHealthy ? "var(--ok)" : "var(--danger)"} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ ...styles.heroTitle, color: fleetHealthy ? "var(--ok)" : "var(--danger)" }}>
            {fleetHealthy ? "All units operational" : `${allOpenFaults.length} unit${allOpenFaults.length === 1 ? "" : "s"} need attention`}
          </div>
          <div style={styles.heroSub}>
            {daysSinceLastFault === null ? "No faults reported yet" : `${daysSinceLastFault} day${daysSinceLastFault === 1 ? "" : "s"} since last reported fault`}
          </div>
          {!fleetHealthy && (
            <div style={styles.heroChipRow}>
              {allOpenFaults.map((f) => (
                <span
                  key={`${f.trainType}|${f.fleetNo}`}
                  style={styles.heroChip}
                  onClick={(e) => {
                    e.stopPropagation();
                    setExpandedFault(`${f.trainType}|${f.fleetNo}`);
                    const el = document.getElementById("fleet-repair-snapshot");
                    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
                  }}
                >
                  {f.fleetNo}
                </span>
              ))}
            </div>
          )}
        </div>
        <Icon path={ICONS.chevronDown} size={16} color={fleetHealthy ? "var(--ok)" : "var(--danger)"} style={{ transform: "rotate(-90deg)", flexShrink: 0, opacity: 0.6 }} />
      </div>

      <div style={styles.workloadBanner}>
        {workload.map(({ truck, count }) => (
          <div key={truck} className="rise dash-panel" style={styles.workloadCard}>
            <span style={styles.workloadTruck}>{truck}</span>
            <span style={styles.workloadCount}>{count}</span>
            <span style={styles.workloadLabel}>services today</span>
          </div>
        ))}
      </div>

      <div style={styles.periodRow}>
        <span style={styles.periodLabel}>Showing</span>
        <div style={styles.segmented}>
          {[{ id: "7d", label: "7 days" }, { id: "30d", label: "30 days" }, { id: "all", label: "All time" }].map((p) => (
            <button key={p.id} type="button" onClick={() => setPeriod(p.id)} style={{ ...styles.segmentedBtnSm, ...(period === p.id ? styles.segmentedBtnActive : {}) }}>{p.label}</button>
          ))}
        </div>
      </div>

      <div style={{ ...styles.statRow, gridTemplateColumns: "repeat(2, 1fr)" }}>
        <div className="rise stat-card" style={styles.statCard}><div className="stat-value" style={styles.statValue}>{totalServicesDisplay}</div><div style={styles.statLabel}>Services logged</div></div>
        <div className="rise stat-card" style={{ ...styles.statCard, animationDelay: ".05s" }}><div className="stat-value" style={styles.statValue}>{totalInspectionsDisplay}</div><div style={styles.statLabel}>Inspections</div></div>
      </div>

      <div id="fleet-repair-snapshot" className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".08s", ...(trainRepairSnapshot.length ? styles.panelAlert : {}) }}>
        <div style={styles.panelTitleRow}>
          <div className="panel-title" style={{ ...styles.panelTitle, marginBottom: 0 }}>Fleet Repair Snapshot</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button style={styles.reportFaultBtn} onClick={() => setReportFaultOpen(true)}><Icon path={ICONS.plus} size={13} style={{ marginRight: 5 }} />Report fault</button>
            <span style={styles.liveTag}><Icon path={ICONS.circle} size={7} className="live-dot" style={{ marginRight: 4 }} />Live</span>
          </div>
        </div>
        <FilterBar filters={snapshotFilters} setFilters={setSnapshotFilters} trucks={trucks} showOpenOnly={false} showFault={true} />
        {trainRepairSnapshot.length === 0 ? (
          <div style={styles.allClear}><Icon path={ICONS.check} size={16} color="var(--ok)" style={{ marginRight: 8 }} />No trains currently reported with outstanding toilet faults</div>
        ) : (
          <div className={trainRepairSnapshot.length > 3 ? "scroll-cap" : ""} style={{ display: "flex", flexDirection: "column", gap: 10, ...(trainRepairSnapshot.length > 3 ? styles.scrollCap : {}) }}>
            {trainRepairSnapshot.map((entry) => {
              const age = ageBadge(entry);
              const key = `${entry.trainType}|${entry.fleetNo}`;
              const isExpanded = expandedFault === key;
              const codeInfo = TOILET_FAULT_CODES.find((c) => c.code === entry.faultCode);
              return (
                <div key={key} className="snapshot-card" style={{ ...styles.snapshotCard, cursor: "pointer" }} onClick={() => setExpandedFault(isExpanded ? null : key)}>
                  <div style={styles.snapshotTop}>
                    <span style={styles.snapshotTruck}><TrainBadge type={entry.trainType} />&nbsp;{entry.fleetNo}{entry.car ? ` / car ${entry.car}` : ""}</span>
                  </div>
                  <div style={styles.snapshotSubRow}>
                    <span style={styles.snapshotDate}>{fmtDate(entry.date)}</span>
                    <span style={{ ...styles.ageBadge, color: age.color, background: `${age.color}22` }}>{age.label}</span>
                  </div>
                  <div style={styles.snapshotFault}>
                    <Icon path={ICONS.alert} size={12} style={{ marginRight: 5, flexShrink: 0 }} />{faultSummary(entry)}
                    <Icon path={ICONS.chevronDown} size={13} color="var(--muted)" style={{ marginLeft: "auto", flexShrink: 0, transform: isExpanded ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
                  </div>
                  <div style={styles.snapshotMeta}>
                    {entry.truck} · {entry.operator || "unassigned"}<PhotoLink photo={entry.photo} />
                    {(entry.pumpedLocked || entry.deferred72h) && (
                      <span style={styles.chipRow}>
                        {entry.pumpedLocked && <span style={styles.chip}>Pumped</span>}
                        {entry.deferred72h && <span style={styles.chip}>72hr deferment</span>}
                      </span>
                    )}
                  </div>
                  {isExpanded && (
                    <div style={styles.faultDetailBox} onClick={(e) => e.stopPropagation()}>
                      {codeInfo ? (
                        <React.Fragment>
                          <div style={styles.faultDetailLabel}>Description</div>
                          <div style={styles.faultDetailText}>{codeInfo.description}</div>
                          <div style={{ ...styles.faultDetailLabel, marginTop: 10 }}>Possible cause</div>
                          <ul style={styles.faultCauseList}>
                            {codeInfo.causes.map((c, i) => <li key={i}>{c}</li>)}
                          </ul>
                        </React.Fragment>
                      ) : (
                        <div style={styles.faultDetailText}>No fault code recorded for this entry — see flags/notes above for detail.</div>
                      )}
                      {entry.notes && (
                        <React.Fragment>
                          <div style={{ ...styles.faultDetailLabel, marginTop: 10 }}>Operator notes</div>
                          <div style={styles.faultDetailText}>{entry.notes}</div>
                        </React.Fragment>
                      )}
                      <ResolveFaultInline entry={entry} onResolve={onResolveFault} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {repeatOffenders.length > 0 && (
        <div className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".1s", ...styles.panelAlert }}>
          <div className="panel-title" style={styles.panelTitle}>Re-occurring Faults</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {repeatOffenders.map(({ car, entries }) => (
              <div key={car} style={styles.snapshotCard}>
                <div style={{ ...styles.snapshotTop, justifyContent: "space-between" }}>
                  <span style={styles.snapshotTruck}><Icon path={ICONS.alert} size={14} color="var(--danger)" style={{ marginRight: 6 }} />Car {car}</span>
                  <span style={styles.repeatCountBadge}>{entries.length}× this week</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 6 }}>
                  {entries.map((e) => (
                    <div key={e.id} style={styles.snapshotMeta}>
                      {fmtDate(e.date)} — {e.trainType} {e.fleetNo} · {faultSummary(e)}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".11s" }}>
        <div className="panel-title" style={styles.panelTitle}>Resolved Faults{resolvedFaults.length > 0 ? ` (${resolvedFaults.length})` : ""}</div>
        {resolvedFaults.length === 0 ? (
          <div style={styles.emptyState}>Nothing marked resolved yet.</div>
        ) : (
          <div className={resolvedFaults.length > 3 ? "scroll-cap" : ""} style={{ display: "flex", flexDirection: "column", gap: 10, ...(resolvedFaults.length > 3 ? styles.scrollCap : {}) }}>
            {resolvedFaults.map((entry) => (
              <div key={entry.id} className="snapshot-card" style={{ ...styles.snapshotCard, border: "1px solid rgba(63,185,138,0.3)" }}>
                <div style={styles.snapshotTop}>
                  <span style={styles.snapshotTruck}><TrainBadge type={entry.trainType} />&nbsp;{entry.fleetNo}{entry.car ? ` / car ${entry.car}` : ""}</span>
                </div>
                <div style={styles.snapshotSubRow}>
                  <span style={styles.snapshotDate}>Resolved {entry.resolvedAt ? new Date(entry.resolvedAt).toLocaleDateString("en-AU") : "—"}{entry.resolvedBy ? ` by ${entry.resolvedBy}` : ""}</span>
                  <span style={{ ...styles.ageBadge, color: "var(--ok)", background: "rgba(63,185,138,0.14)" }}>{entry.hoursOpen < 24 ? `${entry.hoursOpen}h to fix` : `${Math.round(entry.hoursOpen / 24)}d to fix`}</span>
                </div>
                <div style={{ fontSize: 13, color: "var(--chalk)", fontWeight: 600, marginTop: 8 }}>{faultSummary(entry)}</div>
                {entry.resolutionNotes && <div style={styles.snapshotMeta}>{entry.resolutionNotes}</div>}
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="desktop-2col">
        <div className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".12s" }}>
          <div style={styles.panelTitleRow}>
            <div className="panel-title" style={{ ...styles.panelTitle, marginBottom: 0 }}>Faults Reported</div>
            <div style={styles.segmented}>
              <button type="button" onClick={() => setFaultView("code")} style={{ ...styles.segmentedBtnSm, ...(faultView === "code" ? styles.segmentedBtnActive : {}) }}>By code</button>
              <button type="button" onClick={() => setFaultView("flag")} style={{ ...styles.segmentedBtnSm, ...(faultView === "flag" ? styles.segmentedBtnActive : {}) }}>By type</button>
            </div>
          </div>
          <BarChart data={faultView === "code" ? topFaultCodes : flagCounts} color={faultView === "code" ? "var(--danger)" : "var(--amber)"} />
        </div>
        <div className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".16s" }}>
          <div className="panel-title" style={styles.panelTitle}>Services by Operator</div>
          <BarChart data={operatorTally} color="var(--amber)" />
        </div>
      </div>

      <div className="rise dash-panel" style={{ ...styles.panel, animationDelay: ".13s" }}>
        <div className="panel-title" style={styles.panelTitle}>Servicing Patterns</div>
        <div className="desktop-2col">
          <div>
            <div style={styles.subPanelLabel}>AM / PM split</div>
            <DonutStat a={amPm.am} b={amPm.pm} labelA="AM (before 12pm)" labelB="PM (12pm+)" colorA="var(--amber)" colorB="var(--ok)" />
          </div>
          <div>
            <div style={styles.subPanelLabel}>Planned vs ad-hoc</div>
            <DonutStat a={planned} b={adhoc} labelA="Planned" labelB="Ad-hoc" />
          </div>
        </div>
      </div>

      {reportFaultOpen && (
        <ReportFaultModal trucks={trucks} fleet={fleet} onClose={() => setReportFaultOpen(false)}
          onSubmit={(entry) => { onAddFault(entry); setReportFaultOpen(false); }} />
      )}
    </div>
  );
}

function ReportFaultModal({ trucks, fleet, onClose, onSubmit }) {
  const [trainType, setTrainType] = useState(TRAIN_TYPES[0]);
  const [fleetNo, setFleetNo] = useState("");
  const [car, setCar] = useState("");
  const [faultCode, setFaultCode] = useState("");
  const [faultFlags, setFaultFlags] = useState([]);
  const [reportedBy, setReportedBy] = useState("");
  const [notes, setNotes] = useState("");
  const [date, setDate] = useState(todayISO());
  const [saving, setSaving] = useState(false);

  const vehicleOptions = fleet?.[trainType] || [];
  const carOptions = getCarOptions(trainType, fleetNo);
  useEffect(() => {
    if (carOptions.length && !carOptions.includes(car)) setCar(carOptions[0]);
    if (!carOptions.length && car) setCar("");
  }, [trainType, fleetNo]);
  useEffect(() => { if (trainType === "Locomotive" && faultCode) setFaultCode(""); }, [trainType]);

  const toggleFlag = (flag) => setFaultFlags((p) => (p.includes(flag) ? p.filter((x) => x !== flag) : [...p, flag]));

  const submit = (e) => {
    e.preventDefault();
    if (!fleetNo || !reportedBy.trim() || saving) return;
    setSaving(true);
    const entry = {
      date, time: new Date().toTimeString().slice(0, 5), truck: "Fitter Report", trainType, fleetNo, car,
      serviceType: "Ad-hoc", repairRequired: true, faultCode, faultFlags, pumpedLocked: false, deferred72h: false,
      photo: null, reported: true, operator: reportedBy.trim(), notes: notes.trim(), fitterReport: true,
    };
    onSubmit(entry);
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div className="rise" style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <span style={styles.panelTitleText}>Report a fault</span>
          <button type="button" style={styles.refreshBtn} onClick={onClose}><Icon path={ICONS.x} size={14} color="var(--muted)" /></button>
        </div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 16 }}>For a fault reported back by a fitter, without an operator having logged a truck visit.</div>
        <form onSubmit={submit}>
          <div className="desktop-2col" style={styles.formGrid}>
            <Field label="Date"><input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
            <Field label="Reported by"><input style={styles.input} placeholder="Fitter's name" value={reportedBy} onChange={(e) => setReportedBy(e.target.value)} /></Field>
            <Field label="Train type"><select style={styles.select} value={trainType} onChange={(e) => { setTrainType(e.target.value); setFleetNo(""); }}>{TRAIN_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
            <Field label="Vehicle number">
              <input style={styles.input} list="report-fault-fleet-options" placeholder={trainType === "N-Set" ? "e.g. VN12" : "Type or pick"} value={fleetNo} onChange={(e) => setFleetNo(e.target.value)} />
              <datalist id="report-fault-fleet-options">{vehicleOptions.map((o) => <option key={o} value={o} />)}</datalist>
            </Field>
            <Field label="Car number">
              {carOptions.length > 1 ? (
                <select style={styles.select} value={car} onChange={(e) => setCar(e.target.value)}>{carOptions.map((o) => <option key={o}>{o}</option>)}</select>
              ) : (
                <input style={styles.input} value={car || (carOptions[0] || "")} onChange={(e) => setCar(e.target.value)} />
              )}
            </Field>
          </div>

          {trainType === "Locomotive" ? (
            <div style={styles.faultCodeHint}>Locomotive toilets are mechanical — no electrical fault codes apply.</div>
          ) : (
            <Field label="Fault code">
              <select style={styles.select} value={faultCode} onChange={(e) => setFaultCode(e.target.value)}>
                <option value="">None / not shown</option>
                {TOILET_FAULT_CODES.map((c) => <option key={c.code} value={c.code}>CODE {c.code} — {c.name}</option>)}
              </select>
            </Field>
          )}

          <div style={styles.checkGrid}>
            {FAULT_FLAGS.map((flag) => {
              const active = faultFlags.includes(flag);
              return (
                <div key={flag} style={styles.checkItem} onClick={() => toggleFlag(flag)}>
                  <div style={{ ...styles.checkbox, ...(active ? styles.checkboxOn : {}) }}>{active && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
                  <span style={styles.checkItemLabel}>{flag}</span>
                </div>
              );
            })}
          </div>

          <Field label="Notes"><textarea style={styles.textarea} placeholder="Details of what the fitter reported" value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>

          <button type="submit" disabled={saving} style={{ ...styles.submitBtn, opacity: saving ? 0.6 : 1 }}>{saving ? "Saving…" : "Add fault to dashboard"}</button>
        </form>
      </div>
    </div>
  );
}

function PhotoLink({ photo }) {
  const [open, setOpen] = useState(false);
  if (!photo) return null;
  return (
    <React.Fragment>
      <span style={styles.photoLink} onClick={(e) => { e.stopPropagation(); setOpen(true); }}> · <Icon path={ICONS.camera} size={11} style={{ verticalAlign: "-1px", marginRight: 3 }} />view photo</span>
      {open && (
        <div style={styles.photoLightbox} onClick={(e) => { e.stopPropagation(); setOpen(false); }}>
          <img src={photo} alt="Attached fault photo" style={styles.photoLightboxImg} onClick={(e) => e.stopPropagation()} />
          <button style={styles.photoLightboxClose} onClick={() => setOpen(false)}><Icon path={ICONS.x} size={16} color="#fff" /></button>
        </div>
      )}
    </React.Fragment>
  );
}

function Field({ label, children }) { return (<label style={styles.field}><span style={styles.fieldLabel}>{label}</span>{children}</label>); }

function PhotoUpload({ photo, onChange }) {
  const inputRef = useRef(null);
  return (
    <Field label="Photo (optional)">
      {photo ? (
        <div style={styles.photoWrap}><img src={photo} alt="Fault" style={styles.photoPreview} /><button type="button" style={styles.photoRemoveBtn} onClick={() => onChange(null)}><Icon path={ICONS.x} size={13} color="#fff" /></button></div>
      ) : (
        <button type="button" style={styles.photoAddBtn} onClick={() => inputRef.current?.click()}>Add photo</button>
      )}
      <input ref={inputRef} type="file" accept="image/*" style={{ display: "none" }}
        onChange={(e) => { const file = e.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => onChange(reader.result); reader.readAsDataURL(file); e.target.value = ""; }} />
    </Field>
  );
}

function FaultDetails({ f, set }) {
  const flags = f.faultFlags || [];
  const toggleFlag = (flag) => set("faultFlags", flags.includes(flag) ? flags.filter((x) => x !== flag) : [...flags, flag]);
  const selected = TOILET_FAULT_CODES.find((c) => c.code === f.faultCode);
  return (
    <div style={styles.faultBox}>
      {f.trainType === "Locomotive" ? (
        <div style={styles.faultCodeHint}>Locomotive toilets are mechanical (no electrical fault codes) — use the checklist below and notes for detail.</div>
      ) : (
        <Field label="Fault code">
          <select style={styles.select} value={f.faultCode} onChange={(e) => set("faultCode", e.target.value)}>
            <option value="">None / not shown</option>
            {TOILET_FAULT_CODES.map((c) => <option key={c.code} value={c.code}>CODE {c.code} — {c.name}</option>)}
          </select>
          {selected && <span style={styles.faultCodeHint}>{selected.description}</span>}
        </Field>
      )}
      <div style={styles.checkGrid}>
        {FAULT_FLAGS.map((flag) => {
          const active = flags.includes(flag);
          const isChangeOut = flag === "Requires change out";
          return (
            <React.Fragment key={flag}>
              <div style={styles.checkItem} onClick={() => toggleFlag(flag)}><div style={{ ...styles.checkbox, ...(active ? styles.checkboxOn : {}) }}>{active && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div><span style={styles.checkItemLabel}>{flag}</span></div>
              {isChangeOut && active && (
                <div style={styles.subQuestionStack}>
                  <div style={styles.subQuestionBox} onClick={() => set("pumpedLocked", !f.pumpedLocked)}>
                    <div style={{ ...styles.checkbox, ...(f.pumpedLocked ? styles.checkboxOn : {}) }}>{f.pumpedLocked && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
                    <span style={styles.checkItemLabel}>Has the toilet been pumped?</span>
                  </div>
                  <div style={styles.subQuestionBox} onClick={() => set("deferred72h", !f.deferred72h)}>
                    <div style={{ ...styles.checkbox, ...(f.deferred72h ? styles.checkboxOn : {}) }}>{f.deferred72h && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
                    <span style={styles.checkItemLabel}>Has it been placed on 72hr deferment?</span>
                  </div>
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
      <PhotoUpload photo={f.photo} onChange={(v) => set("photo", v)} />
    </div>
  );
}

function ServiceForm({ trucks, fleet, editingEntry, onSubmit, onCancelEdit }) {
  const blank = { date: todayISO(), time: new Date().toTimeString().slice(0, 5), truck: trucks[0], operator: "", trainType: TRAIN_TYPES[0], fleetNo: "", car: "", serviceType: "Planned", repairRequired: false, faultCode: "", faultFlags: [], pumpedLocked: false, deferred72h: false, photo: null, reported: false, notes: "" };
  const [f, setF] = useState(editingEntry || blank);
  useEffect(() => { setF(editingEntry || blank); }, [editingEntry]);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const submit = (e) => { e.preventDefault(); if (!f.operator || !f.fleetNo) return; onSubmit(f); if (!editingEntry) setF({ ...blank, date: todayISO(), time: new Date().toTimeString().slice(0, 5) }); };
  const vehicleOptions = fleet?.[f.trainType] || [];
  const carOptions = getCarOptions(f.trainType, f.fleetNo);
  useEffect(() => {
    if (carOptions.length && !carOptions.includes(f.car)) set("car", carOptions[0]);
  }, [f.trainType, f.fleetNo]);
  useEffect(() => {
    if (f.trainType === "Locomotive" && f.faultCode) set("faultCode", "");
  }, [f.trainType]);
  return (
    <form onSubmit={submit} style={styles.form}>
      {editingEntry && (<div style={styles.editBanner}><span>Editing entry from {fmtDate(editingEntry.date)}</span><button type="button" style={styles.cancelEditBtn} onClick={onCancelEdit}>Cancel</button></div>)}
      <div className="desktop-2col" style={styles.formGrid}>
        <Field label="Truck"><select style={styles.select} value={f.truck} onChange={(e) => set("truck", e.target.value)}>{trucks.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <Field label="Date"><input style={styles.input} type="date" value={f.date} onChange={(e) => set("date", e.target.value)} /></Field>
        <Field label="Time"><input style={styles.input} type="time" value={f.time} onChange={(e) => set("time", e.target.value)} /></Field>
        <Field label="Operator"><input style={styles.input} placeholder="Name" value={f.operator} onChange={(e) => set("operator", e.target.value)} /></Field>
        <Field label="Train type"><select style={styles.select} value={f.trainType} onChange={(e) => { set("trainType", e.target.value); set("fleetNo", ""); }}>{TRAIN_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <Field label="Vehicle number">
          <input style={styles.input} list="fleet-options" placeholder={f.trainType === "N-Set" ? "e.g. VN12" : "Type or pick"} value={f.fleetNo} onChange={(e) => set("fleetNo", e.target.value)} />
          <datalist id="fleet-options">{vehicleOptions.map((o) => <option key={o} value={o} />)}</datalist>
        </Field>
        <Field label="Car number">
          {carOptions.length > 1 ? (
            <select style={styles.select} value={f.car} onChange={(e) => set("car", e.target.value)}>{carOptions.map((o) => <option key={o}>{o}</option>)}</select>
          ) : (
            <input style={styles.input} value={f.car || (carOptions[0] || "")} onChange={(e) => set("car", e.target.value)} />
          )}
        </Field>
        <Field label="Service type"><div style={styles.segmented}>{["Planned", "Ad-hoc"].map((opt) => (<button type="button" key={opt} onClick={() => set("serviceType", opt)} style={{ ...styles.segmentedBtn, ...(f.serviceType === opt ? styles.segmentedBtnActive : {}) }}>{opt}</button>))}</div></Field>
      </div>
      <div style={styles.toggleRow} onClick={() => set("repairRequired", !f.repairRequired)}><div style={{ ...styles.checkbox, ...(f.repairRequired ? styles.checkboxOn : {}) }}>{f.repairRequired && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div><span style={styles.toggleLabel}>Toilet requires repairs</span></div>
      {f.repairRequired && <FaultDetails f={f} set={set} />}
      <div style={styles.toggleRow} onClick={() => set("reported", !f.reported)}><div style={{ ...styles.checkbox, ...(f.reported ? styles.checkboxOn : {}) }}>{f.reported && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div><span style={styles.toggleLabel}>Reported to supervisor</span></div>
      <Field label="Notes (optional)"><textarea style={styles.textarea} placeholder="Anything else worth noting" value={f.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
      <button type="submit" style={styles.submitBtn}>{editingEntry ? "Save changes" : "Log service"}</button>
    </form>
  );
}

function History({ logs, inspections, onDeleteLog, onDeleteInspection, onEditLog, onExport, onClearAll, trucks, isAdmin }) {
  const [view, setView] = useState("logs");
  const [filters, setFilters] = useState({ openOnly: false, range: "all", truck: "all", fault: "all" });
  const filteredLogs = useMemo(() => applyFilters(logs, filters), [logs, filters]);
  const filteredInspections = useMemo(() => applyFilters(inspections, { ...filters, fault: "all" }), [inspections, filters]);
  return (
    <div>
      <div style={styles.historyHeader}>
        <div style={styles.segmented}>
          <button style={{ ...styles.segmentedBtn, ...(view === "logs" ? styles.segmentedBtnActive : {}) }} onClick={() => setView("logs")}>Service ({filteredLogs.length})</button>
          <button style={{ ...styles.segmentedBtn, ...(view === "inspect" ? styles.segmentedBtnActive : {}) }} onClick={() => setView("inspect")}>Inspections ({filteredInspections.length})</button>
        </div>
        <button style={styles.exportBtn} onClick={onExport}><Icon path={ICONS.download} size={14} style={{ marginRight: 6 }} />Export Excel</button>
      </div>

      {!isAdmin && <div style={styles.readOnlyNote}><Icon path={ICONS.lock} size={12} style={{ marginRight: 6, flexShrink: 0 }} />View only — editing and deleting entries is restricted to admins.</div>}

      <FilterBar filters={filters} setFilters={setFilters} trucks={trucks} showOpenOnly={true} showFault={view === "logs"} />

      {view === "logs" && (
        <div style={styles.list}>
          {filteredLogs.length === 0 && <div style={styles.emptyState}>No matching service entries.</div>}
          {filteredLogs.map((l) => (
            <div key={l.id} style={{ ...styles.listCard, ...(isAdmin ? {} : { paddingRight: 14 }) }}>
              {isAdmin && <div style={styles.cardActions}><button style={styles.cardActionBtn} onClick={() => onEditLog(l)}><Icon path={ICONS.edit} size={14} color="#9FB0AA" /></button><button style={styles.cardActionBtn} onClick={() => onDeleteLog(l.id)}><Icon path={ICONS.trash} size={14} color="#9FB0AA" /></button></div>}
              <div style={styles.listCardTitle}>{l.truck} — {l.trainType} {l.fleetNo} {l.car && `/ ${l.car}`}</div>
              <div style={styles.listCardMeta}>{fmtDate(l.date)} {l.time} · {l.operator} · {l.serviceType}</div>
              {l.repairRequired && (
                l.resolved ? (
                  <div style={{ ...styles.repairFlag, color: "var(--ok)" }}><Icon path={ICONS.check} size={12} style={{ marginRight: 5 }} />Resolved{l.resolvedBy ? ` by ${l.resolvedBy}` : ""}{l.resolvedAt ? ` · ${new Date(l.resolvedAt).toLocaleDateString("en-AU")}` : ""}</div>
                ) : (
                  <div style={styles.repairFlag}><Icon path={ICONS.alert} size={12} style={{ marginRight: 5 }} />{faultSummary(l)}<PhotoLink photo={l.photo} />{(l.pumpedLocked || l.deferred72h) && (<span style={styles.chipRow}>{l.pumpedLocked && <span style={styles.chip}>Pumped & locked</span>}{l.deferred72h && <span style={styles.chip}>72hr deferment</span>}</span>)}</div>
                )
              )}
            </div>
          ))}
        </div>
      )}

      {view === "inspect" && (
        <div style={styles.list}>
          {filteredInspections.length === 0 && <div style={styles.emptyState}>No matching inspections.</div>}
          {filteredInspections.map((i) => {
            const fails = Object.entries(i.checklist || {}).filter(([, v]) => v === "Fail");
            return (
              <div key={i.id} style={{ ...styles.listCard, ...(isAdmin ? {} : { paddingRight: 14 }) }}>
                {isAdmin && <div style={styles.cardActions}><button style={styles.cardActionBtn} onClick={() => onDeleteInspection(i.id)}><Icon path={ICONS.trash} size={14} color="#9FB0AA" /></button></div>}
                <div style={styles.listCardTitle}>{i.truck} — Daily inspection</div>
                <div style={styles.listCardMeta}>{fmtDate(i.date)} · {i.operator}{i.km ? ` · ${i.km.toLocaleString()} km` : ""}</div>
                {fails.length > 0 && <div style={styles.repairFlag}><Icon path={ICONS.alert} size={12} style={{ marginRight: 5 }} />Failed: {fails.map(([k]) => k).join(", ")}</div>}
                {i.repairRequired && <div style={styles.repairFlag}><Icon path={ICONS.alert} size={12} style={{ marginRight: 5 }} />{faultSummary(i)}<PhotoLink photo={i.photo} /></div>}
              </div>
            );
          })}
        </div>
      )}

      {isAdmin && <button style={styles.dangerBtn} onClick={onClearAll}><Icon path={ICONS.trash} size={13} style={{ marginRight: 6 }} />Clear all data for everyone</button>}
    </div>
  );
}
